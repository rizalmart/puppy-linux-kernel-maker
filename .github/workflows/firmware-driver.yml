name: Linux Firmware Drivers (PC Only)

on:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest

    container:
      image: debian:sid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y wget git squashfs-tools xz-utils ca-certificates python3 parallel rdfind rpm cpio bzip2 zstd \
          build-essential cmake meson ninja-build libglib2.0-dev libtool autoconf autotools-dev \
          libalsa-ocaml-dev libasound2-dev jq curl sdcc

      - name: Download latest Linux firmware
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git linux-firmware-current

      - name: Isolate Linux firmware
        run: |
          mkdir -p linux-firmware-staging
          
          WKDIR=$(pwd)
          
          cd linux-firmware-current
          chmod +x ./copy-firmware.sh
          chmod +x ./dedup-firmware.sh
          ./copy-firmware.sh $WKDIR/linux-firmware-staging 
          ./dedup-firmware.sh $WKDIR/linux-firmware-staging 

      - name: Remove non-PC and rarely used firmware (Python)
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          import shutil

          base = "linux-firmware-staging"

          # DIRECTORIES TO REMOVE (rare / non-PC / embedded / server)
          REMOVE_DIRS = [
              # CPU microcode (AMD is optional for PC)
              "amd-ucode",
              #qualcomm
              "x1e80100", "qdu100", "sm8250", "kaanapali",
              "sdm845", "sa8775p", "sc8280xp", "qrb4210",
              "sm8750", "qcs6490", "vpu", "apq8096", "qcm6490", "apq8016",
              "qcm2290", "qcs615", "aic100", "qcs8300",
              #atheros
              "IPQ8074", "IPQ6018", "IPQ5018", "QCA2066", "QCA6698AQ", "QCN9074",
              #marvel
              "prestera",
              #nxp
              "dpaa2",
              #mediatek
              "mt7925","mt7987","mt7988","mt7996","mt8183","mt8186",
              "mt8188","mt8189","mt8192","mt8195","mt8196",
              # ARM / phone / embedded / SoC boards
              "wil6210", "wcn36xx", "ti-connectivity", "rockchip", "amlogic_vdec",
              "ti-keystone", "r8a779x_usb3", "nxp_mc_firmware", "microchip", "siano",
              # Automotive / industrial / IoT / FPGA
              "adsp", "aspeed", "xc4000", "xc5000", "xc5000c", "automotive", "industrial",
              # Server NICs / Storage / SmartNICs
              "liquidio", "cxgb3", "cxgb4", "qed", "mellanox", "netronome", "qla2xxx", "qla1280", "hfi1_firmware",
              # Non-x86 architectures
              "mips", "powerpc", "riscv", "arm", "arm64", "ppc", "xtensa",
              # ChromeOS / other uncommon
              "google",
          ]

          # FILE PATTERN FILTERS — DELETE if filename contains these words
          REMOVE_PATTERNS = [
              "arm", "aarch64", "tegra", "tablet", "router",
              "fpga", "ml", "neural", "vr", "meta",
              "automotive", "industrial",
          ]

          # Remove directories
          for root, dirs, files in os.walk(base, topdown=True):
              for d in dirs:
                  full = os.path.join(root, d)
                  for bad in REMOVE_DIRS:
                      if bad in full.replace("\\", "/"):
                          shutil.rmtree(full, ignore_errors=True)
                          break

          # Remove files by keyword
          for root, dirs, files in os.walk(base):
              for f in files:
                  lower = f.lower()
                  if any(p in lower for p in REMOVE_PATTERNS):
                      try:
                          os.remove(os.path.join(root, f))
                      except:
                          pass

          EOF

      - name: Fetching Intel Pro Wireless and GT68xx firmware drivers
        run: |

            mkdir -p linux-firmware-additional/usr/share
            mkdir -p linux-firmware-additional/lib/firmware

            #intel pro wireless
            
            IPW2100_URL='https://src.fedoraproject.org/repo/pkgs/ipw2100-firmware/ipw2100-fw-1.3.tgz/46aa75bcda1a00efa841f9707bbbd113/ipw2100-fw-1.3.tgz'
            IPW2200_URL='https://src.fedoraproject.org/repo/pkgs/ipw2200-firmware/ipw2200-fw-3.1.tgz/eaba788643c7cc7483dd67ace70f6e99/ipw2200-fw-3.1.tgz'

            IPW2100_FILE=$(basename $IPW2100_URL)
            IPW2200_FILE=$(basename $IPW2200_URL)
            
            wget $IPW2100_URL -O $IPW2100_FILE
            wget $IPW2200_URL -O $IPW2200_FILE
            
            mkdir -p ipw2100
            tar -xf $IPW2100_FILE -C ipw2100
            mv ipw2100/LICENSE ipw2100/LICENSE.ipw2100-fw

            mkdir -p ipw2200
            tar -xf $IPW2200_FILE -C ipw2200
            
            cp -af ipw2100/* linux-firmware-staging
            cp -af ipw2200/ipw2200-fw-3.1/* linux-firmware-staging

            #sane gt86xx
            
            SANE_GT_URL="https://ia601702.us.archive.org/29/items/sane-gt68xx-firmware-1.0.tar/sane-gt68xx-firmware-1.0.tar.gz"
            SANE_GT_FILE=$(basename $SANE_GT_URL)
            SANE_GT_NAME=$(basename $SANE_GT_URL .tar.gz)

            wget $SANE_GT_URL -O $SANE_GT_FILE
            
            mkdir -p sane-temp
            tar -xf $SANE_GT_FILE -C sane-temp
            mkdir -p linux-firmware-additional/usr/share/sane/gt68xx
            cp -f sane-temp/$SANE_GT_NAME/*.usb linux-firmware-additional/usr/share/sane/gt68xx/           
            cp -f sane-temp/$SANE_GT_NAME/*.fw linux-firmware-additional/usr/share/sane/gt68xx/

      - name: Compile and Install b43-fwcutter
        run: |
          # Clone the official tools mirror
          git clone --depth 1 https://github.com/mbuesch/b43-tools.git
          cd b43-tools/fwcutter
          
          # Compile
          make
          
          # Install to /usr/local/bin (requires sudo)
          make install
          
          # Verify it's in the system PATH
          which b43-fwcutter
          b43-fwcutter -v

      - name: Extract B43 Firmware
        run: |
          # Modern B43
          wget https://github.com/minios-linux/b43-firmware/releases/download/b43-firmware/broadcom-wl-6.30.163.46.tar.bz2
          tar xjf broadcom-wl-6.30.163.46.tar.bz2
          b43-fwcutter -w linux-firmware-additional/lib/firmware broadcom-wl-6.30.163.46.wl_apsta.o
          
          # Legacy B43 (v3)
          wget http://downloads.openwrt.org/sources/wl_apsta-3.130.20.0.o
          b43-fwcutter -w linux-firmware-additional/lib/firmware wl_apsta-3.130.20.0.o

      - name: Build Sigrok Firmware
        run: |
          TARGET_DIR=$(pwd)/linux-firmware-additional
          
          git clone https://github.com/sigrokproject/sigrok-firmware-fx2lafw sigrok-firmware-fx2lafw
          cd sigrok-firmware-fx2lafw
          
          ./autogen.sh
          ./configure --prefix=/usr
          make
          make install DESTDIR=$TARGET_DIR

      - name: Build ALSA firmware
        run: |

          TARGET_DIR="$(pwd)/linux-firmware-additional"
          
          # Get the latest version from the official directory
          ALSA_URL="https://www.alsa-project.org/files/pub/firmware/alsa-firmware-1.2.4.tar.bz2"
          ALSA_FILE=$(basename $ALSA_URL)
          ALSA_NAME=$(basename $ALSA_URL .tar.bz2)
          
          wget "$ALSA_URL" -O $ALSA_FILE
          mkdir -p alsa-temp
          tar xjf "$ALSA_FILE" -C alsa-temp
          cd alsa-temp/$ALSA_NAME
          
          # Configure to install directly into our folder
          ./configure --with-hotplug-dir="/lib/firmware" --enable-buildfw --prefix=/usr
          make
          make install DESTDIR=$TARGET_DIR

          rm -rf $TARGET_DIR/lib/firmware/{ct{efx,speq}.bin,ess,korg,sb16,yamaha}
          rm -rf $TARGET_DIR/lib/firmware/turtlebeach       
 
      - name: Fetch Intel SOF Binaries
        run: |
        
          # SOF is typically distributed as signed binaries for specific Intel platforms
          # We'll pull the latest release artifacts

          SOF_URL="https://github.com/thesofproject/sof-bin/releases/download/v2025.12.1/sof-bin-2025.12.1.tar.gz"
          SOF_FILE="$(basename $SOF_URL)"
          SOF_NAME=$(basename $SOF_FILE .tar.gz)
        
          wget $SOF_URL -O $SOF_FILE
          
          mkdir -p sof-temp
          tar -xzf $SOF_FILE -C sof-temp
          
          [ ! -d linux-firmware-staging/intel ] && mkdir -p linux-firmware-staging/intel
          
          cp -ar sof-temp/$SOF_NAME/sof* linux-firmware-staging/intel/

      - name: Prepare SquashFS root
        run: |
          
          mkdir -p squashfs-root/lib
          mkdir -p squashfs-root-usrmerge/usr/lib
          
          cp -a linux-firmware-staging squashfs-root/lib/firmware
          cp -a linux-firmware-staging squashfs-root-usrmerge/usr/lib/firmware
          
          cp -ar linux-firmware-additional/usr squashfs-root/
          cp -ar linux-firmware-additional/lib/firmware/* squashfs-root/lib/firmware/
  
          cp -ar linux-firmware-additional/usr squashfs-root-usrmerge/          
          cp -ar linux-firmware-additional/lib/firmware/* squashfs-root-usrmerge/usr/lib/firmware/
        
          rm -rf squashfs-root/lib/firmware/.git*
          rm -f squashfs-root/lib/firmware/.editorconfig
          rm -f squashfs-root/lib/firmware/.codespell*
          rm -f squashfs-root/lib/firmware/.pre-commit*
          
          rm -rf squashfs-root-usrmerge/usr/lib/firmware/.git*
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.editorconfig
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.codespell*
          rm -f squashfs-root-usrmerge/usr/lib/firmware/.pre-commit*
          
      - name: Create SquashFS image (XZ max compression)
        run: |
          mksquashfs squashfs-root linux-firmware-pconly.sfs \
            -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86
          mksquashfs squashfs-root-usrmerge linux-firmware-pconly-usrmerge.sfs \
            -comp xz -Xdict-size 100% -b 1M -noappend -Xbcj x86            

      - name: Upload firmware image
        uses: actions/upload-artifact@v7
        with:
          name: linux-firmware-pconly
          archive: false
          path: |
                linux-firmware-pconly.sfs

      - name: Upload firmware image usrmerge
        uses: actions/upload-artifact@v7
        with:
          name: linux-firmware-pconly-usrmerge
          archive: false
          path: |
                linux-firmware-pconly-usrmerge.sfs                
